name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0). Leave blank for a dev build.'
        type: string
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.release_identity.outputs.version }}
      publish_authorized: ${{ steps.release_identity.outputs.publish_authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release workflow policy
        run: bash .github/scripts/test-release-workflow-policy.sh

      # The provenance attestation proves WHAT built an artifact. It cannot prove WHO authorised
      # the release: anyone able to push a tag can start this workflow, and the attestation would
      # be perfectly valid. The signing key is the one credential GitHub never holds, so requiring
      # a signed tag is what makes a stolen GitHub account insufficient on its own. The verifier
      # checks the trusted SSH signature and proves the peeled tag commit is the commit selected
      # by actions/checkout before it emits the only value that can enable the publish job.
      - name: Verify release identity
        id: release_identity
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/verify-release-identity.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode
      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.release_identity.outputs.version }}
        run: dotnet build --no-restore -c Release -p:Version="$RELEASE_VERSION"
      # MTP filter syntax, mirroring ci.yml: --filter-not-trait is the
      # Category=Live exclusion. The previous --filter "Category!=Live" is
      # the VSTest form and is rejected as an unknown option under MTP, which
      # causes the test app to report "Zero tests ran" and exit 5.
      - run: dotnet test --no-build -c Release --filter-not-trait 'Category=Live' --ignore-exit-code 8

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.release_identity.outputs.version }}
        run: dotnet pack --no-build -c Release -p:Version="$RELEASE_VERSION" -o artifacts

      # Self-contained binaries for people who do not have the .NET SDK. macOS
      # is built but is listed as untested in the compatibility matrix until
      # someone has actually run it on a Mac. `-f net10.0` is required because
      # the CLI's project graph includes the multi-targeted libraries
      # (net8.0;net10.0). Without it publish fails with NETSDK1129 ("The
      # 'Publish' target is not supported without specifying a target
      # framework"). The CLI is net10.0-only by deliberate scope (ADR 0006),
      # so net10.0 is the only TFM that has a published binary.
      - name: Publish binaries
        env:
          RELEASE_VERSION: ${{ steps.release_identity.outputs.version }}
        run: |
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish src/LakeSpeak.Cli/LakeSpeak.Cli.csproj \
              -c Release -f net10.0 -r "$rid" --self-contained true \
              -p:Version="$RELEASE_VERSION" \
              -p:PublishSingleFile=true \
              -o "publish/$rid"
            ( cd "publish/$rid" && zip -qr "../../artifacts/lakespeak-$RELEASE_VERSION-$rid.zip" . )
          done

      # Only over what actually reaches the release. Running this across the whole build directory
      # put the .nupkg and .snupkg files in the list, and those go to NuGet rather than to the
      # release - so `sha256sum -c SHA256SUMS.txt` failed on four of seven entries for anyone who
      # downloaded the release and followed SECURITY.md. Shipped that way in 0.1.0.
      - name: Checksums
        run: cd artifacts && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      # An SBOM is the vendor list an adopter's SOC 2 vendor-risk review asks
      # for. Generated from the restored graph, not hand-maintained. Pin the tool because this
      # privileged job attests and publishes the files produced after the SBOM step.
      - name: SBOM
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX LakeSpeak.slnx -o artifacts --json --filename sbom.json

      # The zips are attested as well as the packages. Attesting only the .nupkg files left the
      # three downloadable binaries unattested, so `gh attestation verify` on a downloaded release
      # binary failed - which is precisely the command SECURITY.md tells an adopter to run.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.zip

      # The attestation is reachable through GitHub's Attestations API, but the bundle also has to
      # land on the release itself: tooling that verifies a downloaded artifact offline has no API
      # to consult, and OpenSSF Scorecard's Signed-Releases check reads release assets rather than
      # that API. Without this the provenance exists and still scores zero.
      - name: Stage the provenance bundle alongside the artifacts
        run: cp "${{ steps.attest.outputs.bundle-path }}" artifacts/provenance.intoto.jsonl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/

  publish:
    needs: build
    # Only a signed-tag push can make the verifier emit true. Every manual dispatch is a
    # nonpublishing rehearsal. Retry a failed publish job within its original workflow run.
    if: needs.build.outputs.publish_authorized == 'true'
    runs-on: ubuntu-latest
    # A protected environment turns publishing into a decision someone makes,
    # rather than a side effect of pushing a tag.
    environment: nuget
    permissions:
      contents: write
      # Lets GitHub mint the short-lived OIDC token that nuget.org exchanges for a temporary
      # API key. This is what removes the long-lived secret from the repository entirely.
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Fail early if trusted publishing is not configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is not set. See RELEASING.md — trusted publishing needs the nuget.org profile name and a matching policy on nuget.org."
            exit 1
          fi

      # Exchanged immediately before the push: the temporary key nuget.org issues lasts one hour,
      # and each OIDC token buys exactly one key.
      - name: Exchange the OIDC token for a temporary NuGet key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Every publication runs at the verified tag, so the release assets stay bound to the same
      # release identity as the packages.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/sbom.json
            artifacts/provenance.intoto.jsonl
          generate_release_notes: true
          # SemVer says a hyphen in the version makes it a prerelease. Without this the action
          # defaults to a full release, so 0.1.0-preview.1 published as "Latest" -- telling
          # everyone arriving at the repo that a preview is the stable build.
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
