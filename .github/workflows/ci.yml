name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Refresh-lock-files dispatches this explicitly after its GITHUB_TOKEN push. GitHub suppresses
  # the ordinary push event for that token, so the maintenance workflow needs this entry point.
  workflow_dispatch:

# Least privilege by default. Jobs needing more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each TFM compiles once, in parallel. Tool-smoke downloads both packages.
        tfm: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - if: matrix.tfm == 'net8.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # --locked-mode makes packages.lock.json authoritative: a transitive
      # version that drifted since review fails here instead of shipping.
      # Named, so the failure can say what to do about it. NU1004 on a Dependabot branch means
      # the lock files were not regenerated, which is a chore rather than a defect -- and the
      # error NuGet prints for it does not mention the fix.
      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          # The net8.0 cell uses the libraries-only slnx because LakeSpeak.Cli and
          # LakeSpeak.Cli.Tests are net10.0-only. Building them on net8.0 fails with
          # NETSDK1005 ("Assets file doesn't have a target for 'net8.0'"), and the
          # `-f net8.0` filter still walks every project in the slnx.
          slnx="$([ "${{ matrix.tfm }}" = 'net8.0' ] && echo 'tests/libraries-only.slnx' || echo 'LakeSpeak.slnx')"
          if ! dotnet restore "$slnx" --locked-mode; then
            echo "::error title=Lock files are out of step::dotnet restore --locked-mode failed. If this is a dependency bump, Dependabot cannot rewrite packages.lock.json under central package management. Run the 'Refresh lock files' workflow against ${{ github.head_ref || github.ref_name }}, then re-run these checks."
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          slnx="$([ "${{ matrix.tfm }}" = 'net8.0' ] && echo 'tests/libraries-only.slnx' || echo 'LakeSpeak.slnx')"
          dotnet build "$slnx" --no-restore -c Release -f ${{ matrix.tfm }}

      # Formatting is enforced in-build by EnforceCodeStyleInBuild; this catches
      # whitespace-only drift the analyzers do not see.
      - name: Format
        shell: bash
        run: |
          slnx="$([ "${{ matrix.tfm }}" = 'net8.0' ] && echo 'tests/libraries-only.slnx' || echo 'LakeSpeak.slnx')"
          dotnet format "$slnx" --verify-no-changes --no-restore

      - name: Workflow policy tests
        if: matrix.tfm == 'net10.0'
        run: |
          bash .github/scripts/test-release-workflow-policy.sh
          python .github/scripts/test-maintenance-workflow-policy.py

      - name: Fail on vulnerable packages
        shell: bash
        run: |
          slnx="$([ "${{ matrix.tfm }}" = 'net8.0' ] && echo 'tests/libraries-only.slnx' || echo 'LakeSpeak.slnx')"
          python .github/scripts/test_check_nuget_vulnerabilities.py
          python .github/scripts/check_nuget_vulnerabilities.py "$slnx"

      # A tool package that does not install is a broken release, and the failure
      # only appears at `dotnet tool install` time unless it is checked here.
      # Done in a separate job below: the per-TFM matrix build cannot satisfy the
      # pack step, because LakeSpeak.Genie and friends are multi-targeted
      # (net8.0;net10.0) and `dotnet pack` walks every TFM of every project in
      # the slnx. Building -f net10.0 only on the net10.0 cell leaves the net8.0
      # artefacts missing, and pack fails with NU5026.

  # Produces the nupkg/snipkg artefacts that tool-smoke installs. Has to be a
  # single-shot job (not a matrix cell) because the libraries are multi-targeted
  # (net8.0;net10.0). `dotnet pack` walks every TFM of every project in the
  # slnx, so packing on a cell that built only one TFM leaves the other TFM's
  # artefacts missing and pack fails with NU5026.
  pack:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          if ! dotnet restore LakeSpeak.slnx --locked-mode; then
            echo "::error title=Lock files are out of step::dotnet restore --locked-mode failed. If this is a dependency bump, Dependabot cannot rewrite packages.lock.json under central package management. Run the 'Refresh lock files' workflow against ${{ github.head_ref || github.ref_name }}, then re-run these checks."
            exit 1
          fi
      - name: Build and pack
        # `dotnet pack` builds any project whose output the pack step needs, so
        # both TFMs of the multi-targeted libraries end up in bin/ before pack
        # gathers them into the nupkg. The previous shape used `--no-build`
        # because the build job had already produced the artefacts, but with the
        # build split per TFM the per-TFM artefacts were not symmetric.
        run: |
          dotnet pack LakeSpeak.slnx -c Release -o artifacts --no-restore -p:PackParallel=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/*.nupkg

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI reads terminal width, honours NO_COLOR and shells out to the
        # Databricks CLI. All three behave differently on Windows, so a
        # Linux-only matrix would not cover the primary maintainer's own platform.
        # macOS is added because a tool that is only ever tested on Windows and
        # Linux can quietly depend on case-insensitive file paths or LF line
        # endings; running the suite on a third platform catches that class of
        # defect before users do.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Each TFM gets its own cell so a regression on one does not mask a pass on the
        # other. The net10.0-only CLI projects are skipped automatically in net8.0 cells
        # when we invoke them individually below. See ADR 0006.
        tfm: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - if: matrix.tfm == 'net8.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - shell: bash
        run: |
          slnx="$([ "${{ matrix.tfm }}" = 'net8.0' ] && echo 'tests/libraries-only.slnx' || echo 'LakeSpeak.slnx')"
          dotnet restore "$slnx" --locked-mode

      # Live tests need a real workspace and real credentials. They are excluded
      # here by trait rather than omitted from the solution, so they still compile.
      # MTP mode is enabled by global.json's `test.runner: Microsoft.Testing.Platform`;
      # xunit v3's MTP filter syntax is `--filter-not-trait "Category=Live"`.
      # `--results-directory TestResults` writes test results to ./TestResults/.
      #
      # The net8.0 cell uses a second slnx that excludes the net10.0-only CLI projects
      # so the slnx-level runner can proceed under MTP discovery with -f net8.0. See
      # tests/libraries-only.slnx.
      - name: Test (all targets, ${{ matrix.tfm }})
        if: matrix.tfm == 'net10.0'
        run: dotnet test --no-restore -c Release --filter-not-trait 'Category=Live' --results-directory TestResults --ignore-exit-code 8
      - name: Test (library targets, ${{ matrix.tfm }})
        if: matrix.tfm == 'net8.0'
        run: dotnet test tests/libraries-only.slnx --no-restore -c Release --filter-not-trait 'Category=Live' --results-directory TestResults --ignore-exit-code 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tfm }}
          path: TestResults/

  # The install path users actually take. Packing proves the package builds;
  # this proves it installs and the entry point runs.
  tool-smoke:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts
      - name: Install and run
        run: |
          dotnet tool install --global --add-source ./artifacts LakeSpeak.Cli \
            --version "$(ls artifacts/LakeSpeak.Cli.*.nupkg | sed -E 's/.*LakeSpeak\.Cli\.(.*)\.nupkg/\1/')"
          export PATH="$PATH:$HOME/.dotnet/tools"
          lakespeak --version
